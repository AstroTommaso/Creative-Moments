name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['backend/**']
  pull_request:
    paths-ignore: ['backend/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android build
    runs-on: ubuntu-latest
    needs: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - run: flutter pub get
      - name: "Build APK (placeholder config: the build must not need real secrets)"
        run: flutter build apk --release --dart-define=API_BASE_URL=https://example.invalid

  ios:
    name: iOS build (no codesign)
    runs-on: macos-latest
    needs: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=https://example.invalid
